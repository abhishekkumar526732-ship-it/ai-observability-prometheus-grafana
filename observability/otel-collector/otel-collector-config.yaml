# ==============================================================================
# OpenTelemetry Collector Configuration for AWS EKS & AWS Observability
# Compatible with AWS Distro for OpenTelemetry (ADOT) Collector v0.40.0+
# ==============================================================================

extensions:
  # Liveness and readiness probe endpoint for Kubernetes kubelet
  health_check:
    endpoint: 0.0.0.0:13133

  # Diagnostic zPages for internal component inspection (Private only)
  zpages:
    endpoint: 0.0.0.0:55679

  # AWS SigV4 authenticator for Amazon Managed Service for Prometheus (AMP)
  sigv4auth:
    region: "${AWS_REGION}"
    service: "aps"

receivers:
  # OTLP Ingestion Protocol (gRPC & HTTP)
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_concurrent_streams: 1024
      http:
        endpoint: 0.0.0.0:4318

  # Collector internal self-monitoring metrics
  prometheus:
    config:
      scrape_configs:
        - job_name: "otel-collector-internal"
          scrape_interval: 15s
          static_configs:
            - targets: ["0.0.0.0:8888"]

processors:
  # Memory protection processor: Prevents OOMKills under sudden telemetry bursts
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # Batch processor: Reduces network calls and optimizes payload sizes to AWS APIs
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Resource attribution: Standardizes platform metadata across all telemetry signals
  resource:
    attributes:
      - key: service.name
        value: "qa-chatbot"
        action: upsert
      - key: service.namespace
        value: "${K8S_NAMESPACE:qa-chatbot}"
        action: upsert
      - key: deployment.environment
        value: "${ENVIRONMENT:production}"
        action: upsert
      - key: cloud.provider
        value: "aws"
        action: upsert
      - key: cloud.platform
        value: "aws_eks"
        action: upsert

  # Detect AWS EC2 / EKS environment attributes if available
  resourcedetection:
    detectors: [env, eks]
    timeout: 2s
    override: false

exporters:
  # Standard debug console output (useful for troubleshooting, set to 'basic')
  debug:
    verbosity: basic

  # AWS X-Ray Exporter: Forwards distributed trace spans to AWS X-Ray
  awsxray:
    region: "${AWS_REGION}"
    no_verify_ssl: false

  # Amazon CloudWatch EMF (Embedded Metric Format) Exporter
  # Converts OTLP metric streams into CloudWatch Logs with embedded metrics
  awsemf:
    region: "${AWS_REGION}"
    log_group_name: "/aws/eks/qa-chatbot/metrics"
    log_stream_name: "otel-collector-emf"
    namespace: "QAChatbot/AIPlatform"
    dimension_rollup_option: "NoDimensionRollup"
    metric_declarations:
      # HTTP Inbound Request Metrics
      - dimensions: [[service.name, http.status_code], [service.name]]
        metric_name_selectors:
          - "http.server.request.duration"
          - "http.server.requests"
      # AI / LLM Domain Metrics (emitted when application instrumentation is enabled)
      - dimensions: [[service.name, llm.model], [service.name]]
        metric_name_selectors:
          - "llm.latency.ms"
          - "llm.tokens.prompt"
          - "llm.tokens.completion"
          - "llm.tokens.total"
          - "llm.cost.estimated"
          - "llm.errors"

  # Amazon CloudWatch Logs Exporter: For structured application & container logs
  awscloudwatchlogs:
    region: "${AWS_REGION}"
    log_group_name: "/aws/eks/qa-chatbot/application"
    log_stream_name: "otel-collector-logs"
    raw_log: false

  # Amazon Managed Service for Prometheus (AMP) Exporter (Optional)
  prometheusremotewrite:
    endpoint: "${AMP_REMOTE_WRITE_ENDPOINT:https://aps-workspaces.${AWS_REGION}.amazonaws.com/workspaces/dummy/api/v1/remote_write}"
    auth:
      authenticator: sigv4auth
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [health_check, zpages, sigv4auth]
  pipelines:
    # Traces Pipeline
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [awsxray, debug]

    # Metrics Pipeline
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [awsemf, prometheusremotewrite, debug]

    # Logs Pipeline
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [awscloudwatchlogs, debug]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
