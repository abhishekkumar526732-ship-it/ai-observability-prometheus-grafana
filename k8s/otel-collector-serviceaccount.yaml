apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector-sa
  namespace: qa-chatbot
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: ai-platform
  annotations:
    # IAM Role for Service Accounts (IRSA)
    # Allows collector to export metrics to CloudWatch, traces to X-Ray, and metrics to AMP
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/qa-chatbot-otel-collector-irsa-role
