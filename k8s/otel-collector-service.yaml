# ==============================================================================
# OpenTelemetry Collector Internal ClusterIP Service
# Exposes OTLP receiver endpoints strictly within the EKS cluster.
# DO NOT CHANGE TO LoadBalancer OR EXPOSE PUBLICLY.
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: qa-chatbot
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: ai-platform
    app.kubernetes.io/component: telemetry-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: metrics
      port: 8888
      targetPort: 8888
      protocol: TCP
    - name: health
      port: 13133
      targetPort: 13133
      protocol: TCP
