apiVersion: v1
kind: ServiceAccount
metadata:
  name: qa-chatbot-backend-sa
  namespace: qa-chatbot
  labels:
    app.kubernetes.io/name: qa-chatbot-backend
    app.kubernetes.io/part-of: ai-platform
  annotations:
    # IAM Role for Service Accounts (IRSA)
    # Replace <AWS_ACCOUNT_ID> and <AWS_REGION> with your real AWS deployment parameters
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/qa-chatbot-backend-irsa-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qa-chatbot-frontend-sa
  namespace: qa-chatbot
  labels:
    app.kubernetes.io/name: qa-chatbot-frontend
    app.kubernetes.io/part-of: ai-platform
