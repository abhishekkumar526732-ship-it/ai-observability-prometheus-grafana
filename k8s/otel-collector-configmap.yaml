apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: qa-chatbot
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: ai-platform
data:
  otel-collector-config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      zpages:
        endpoint: 0.0.0.0:55679
      sigv4auth:
        region: "${AWS_REGION}"
        service: "aps"

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_concurrent_streams: 1024
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: "otel-collector-internal"
              scrape_interval: 15s
              static_configs:
                - targets: ["0.0.0.0:8888"]

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch:
        timeout: 5s
        send_batch_size: 1024
        send_batch_max_size: 2048
      resource:
        attributes:
          - key: service.name
            value: "qa-chatbot"
            action: upsert
          - key: service.namespace
            value: "${K8S_NAMESPACE:qa-chatbot}"
            action: upsert
          - key: deployment.environment
            value: "${ENVIRONMENT:production}"
            action: upsert
          - key: cloud.provider
            value: "aws"
            action: upsert
          - key: cloud.platform
            value: "aws_eks"
            action: upsert
      resourcedetection:
        detectors: [env, eks]
        timeout: 2s
        override: false

    exporters:
      debug:
        verbosity: basic
      awsxray:
        region: "${AWS_REGION}"
        no_verify_ssl: false
      awsemf:
        region: "${AWS_REGION}"
        log_group_name: "/aws/eks/qa-chatbot/metrics"
        log_stream_name: "otel-collector-emf"
        namespace: "QAChatbot/AIPlatform"
        dimension_rollup_option: "NoDimensionRollup"
        metric_declarations:
          - dimensions: [[service.name, http.status_code], [service.name]]
            metric_name_selectors:
              - "http.server.request.duration"
              - "http.server.requests"
          - dimensions: [[service.name, llm.model], [service.name]]
            metric_name_selectors:
              - "llm.latency.ms"
              - "llm.tokens.prompt"
              - "llm.tokens.completion"
              - "llm.tokens.total"
              - "llm.cost.estimated"
              - "llm.errors"
      awscloudwatchlogs:
        region: "${AWS_REGION}"
        log_group_name: "/aws/eks/qa-chatbot/application"
        log_stream_name: "otel-collector-logs"
        raw_log: false
      prometheusremotewrite:
        endpoint: "${AMP_REMOTE_WRITE_ENDPOINT:https://aps-workspaces.${AWS_REGION}.amazonaws.com/workspaces/dummy/api/v1/remote_write}"
        auth:
          authenticator: sigv4auth
        resource_to_telemetry_conversion:
          enabled: true

    service:
      extensions: [health_check, zpages, sigv4auth]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, resource, batch]
          exporters: [awsxray, debug]
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, resourcedetection, resource, batch]
          exporters: [awsemf, prometheusremotewrite, debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, resource, batch]
          exporters: [awscloudwatchlogs, debug]
      telemetry:
        logs:
          level: info
        metrics:
          address: 0.0.0.0:8888
