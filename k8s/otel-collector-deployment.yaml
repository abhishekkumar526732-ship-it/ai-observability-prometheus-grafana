apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: qa-chatbot
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: ai-platform
    app.kubernetes.io/component: telemetry-collector
spec:
  # POC Configuration: 1 replica for lightweight telemetry ingestion
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: ai-platform
        app.kubernetes.io/component: telemetry-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
    spec:
      serviceAccountName: otel-collector-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          # Pinned AWS Distro for OpenTelemetry (ADOT) Collector image
          image: public.ecr.aws/aws-observability/aws-otel-collector:v0.40.0
          imagePullPolicy: IfNotPresent
          command:
            - "/awscollector"
            - "--config=/conf/otel-collector-config.yaml"
          env:
            - name: AWS_REGION
              value: "<AWS_REGION>"
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ENVIRONMENT
              value: "production"
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: collector-config-vol
              mountPath: /conf
              readOnly: true
      volumes:
        - name: collector-config-vol
          configMap:
            name: otel-collector-config
            items:
              - key: otel-collector-config.yaml
                path: otel-collector-config.yaml
