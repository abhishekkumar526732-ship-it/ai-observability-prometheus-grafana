version: "3.8"

services:
  # ============================================================================
  # Backend API Service (FastAPI + LangChain + Groq)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qa_chatbot_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    ports:
      # Expose FastAPI backend for direct API inspection and Swagger UI (/docs)
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - chatbot-network

  # ============================================================================
  # Frontend Web Service (Nginx Static Host & API Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qa_chatbot_frontend
    restart: unless-stopped
    ports:
      # Accessible in browser at http://localhost:3000
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - chatbot-network

# ==============================================================================
# Isolated Internal Network
# ==============================================================================
networks:
  chatbot-network:
    name: chatbot_network
    driver: bridge
